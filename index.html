<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="lyre-marketplace-demo" content="todo-list"><link rel="stylesheet" href="style.css"><title>To-do list</title></head><body><main><h1>To-do list</h1><section id="form" aria-label="Task entry"><label for="input">Add a task</label><div class="entry"><input id="input" maxlength="500" placeholder="What needs doing?" autocomplete="off" required><button id="add-task" type="button">Add task</button></div></section><ul class="todos" id="todos" aria-label="Your tasks"></ul><p id="status" role="status" aria-live="polite"></p><p class="hint">Saved in this browser. Use each task's checkbox or Delete button. No account or sync.</p></main><script src="script.js"></script></body></html>
